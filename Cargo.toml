[package]
name = "vibezen"
version = "0.1.0"
edition = "2024"
description = "Lightweight native IDE with git and parallel Claude Code agents"

[dependencies]
# GUI: egui with the lightweight OpenGL (glow) backend - redraws only on input.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
# patched copy in vendor/ (see [patch.crates-io]) - used directly for inline code colours
egui_commonmark_backend = { version = "0.26", default-features = false }
# Syntax highlighting (Sublime grammars, Oniguruma regex engine = fastest)
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Find in files (fast literal + regex search)
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
# Text out of attached .docx / .xlsx (zipped XML)
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"

[patch.crates-io]
# Inline `code` in Claude's replies: own font, colour and chip (search for "VibeZen patch")
egui_commonmark = { path = "vendor/egui_commonmark" }
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
